[project]
name = "vocalguard"
version = "0.1.0"
description = "Détecteur d'arnaques vocales en temps réel — Twilio + Transcribe + Claude"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "twilio>=9.3",
    "boto3>=1.35",
    "amazon-transcribe>=0.6.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Détection de voix synthétique — lourd (torch CPU). Installer à part.
voice = [
    "torch>=2.4",
    "transformers>=4.45",
    "soundfile>=0.12",
]
# Repli si Transcribe est interdit par le rôle workshop.
whisper = [
    "faster-whisper>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vocalguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]  # Depends() en argument par défaut : idiomatique FastAPI

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
